[package]
name = "markd-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "egui 界面：渲染、编辑器交互、侧栏、特色功能与应用外壳"

[dependencies]
egui.workspace = true
eframe.workspace = true
image.workspace = true
regex.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
markd-core.workspace = true
markd-platform.workspace = true
portable-pty = "0.9.0"
vte = "0.15.0"
# 侧栏图标是 SVG，编译期嵌入、运行时用 resvg 栅格化。
# 关掉默认特性（文字/系统字体/位图嵌入）后体积和编译时间都小很多，图标只有路径。
resvg = { version = "0.47.0", default-features = false }
arboard.workspace = true
ratex-parser.workspace = true
ratex-layout.workspace = true
ratex-render.workspace = true
ratex-types.workspace = true
ratex-font.workspace = true
ratex-font-loader.workspace = true
ab_glyph.workspace = true
lyon.workspace = true
