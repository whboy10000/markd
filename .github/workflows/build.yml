name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*", "20*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  test:
    name: Test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxcursor-dev libxinerama-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-icccm4-dev \
            libxcb-keysyms1-dev libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev \
            libwayland-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: markd-macos
          - os: ubuntu-latest
            artifact: markd-linux
          - os: windows-latest
            artifact: markd-windows
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxcursor-dev libxinerama-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-icccm4-dev \
            libxcb-keysyms1-dev libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev \
            libwayland-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        if: runner.os != 'macOS'
        run: cargo build --release -p markd

      # 校验 Windows 产物：GUI 子系统（无黑控制台窗）+ 图标已嵌入 EXE 资源段
      - name: Verify Windows EXE (GUI subsystem + embedded icon)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = [IO.File]::ReadAllBytes("target\release\markd.exe")
          # PE 头：e_lfanew(0x3C) → OptionalHeader(+24) → Subsystem(+68，PE32/PE32+ 同)
          $peOff = [BitConverter]::ToInt32($exe, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($exe, $peOff + 24 + 68)
          if ($subsystem -ne 2) { throw "markd.exe subsystem=$subsystem (console), expected 2 (GUI)" }
          # .ico 里的 PNG 流原样存进 RT_ICON 资源（未压缩），检索字节即可证明图标已嵌入
          $enc = [Text.Encoding]::GetEncoding(28591)
          $exeS = $enc.GetString($exe)
          $icoS = $enc.GetString([IO.File]::ReadAllBytes("assets\icon.ico"))
          $sig = $enc.GetString([byte[]](0x89,0x50,0x4E,0x47,0x0D,0x0A,0x1A,0x0A))
          $found = 0
          $i = $icoS.IndexOf($sig)
          while ($i -ge 0) {
            $end = $icoS.IndexOf("IEND", $i)
            if ($end -lt 0) { break }
            $png = $icoS.Substring($i, $end + 8 - $i)   # 含 IEND(4) + CRC(4)
            if ($exeS.Contains($png)) { $found++ }
            $i = $icoS.IndexOf($sig, $i + 1)
          }
          if ($found -eq 0) { throw "no icon PNG resource found in markd.exe" }
          Write-Host "OK: GUI subsystem, $found icon image(s) embedded"

      # macOS 用打包脚本一次产出三种 DMG（intel / apple-silicon / universal），
      # 与本地打包完全同一份逻辑，避免 CI 与本地分叉。
      - name: Package macOS (.app + three .dmg)
        if: runner.os == 'macOS'
        run: |
          set -e
          ./scripts/package-macos.sh
          # 通用 .app 另存一份 zip（快速试用，不经过 DMG 挂载）
          ditto -c -k --keepParent "dist/Markd.app" "Markd-$(
            awk -F'"' '/^version/{print $2; exit}' Cargo.toml
          )-macos.zip"

      # ---------------- Windows: NSIS 安装程序 ----------------
      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $makensis)) {
            choco install nsis -y --no-progress
            $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          }
          $src = (Resolve-Path "target\release").Path
          & $makensis "/DVERSION=$version" "/DSRCDIR=$src" "packaging\windows\installer.nsi"

      # ---------------- Linux: .deb + .rpm + .tar.gz ----------------
      - name: Package Linux (.deb + .rpm + .tar.gz)
        if: runner.os == 'Linux'
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y rpm
          VERSION=$(awk -F'"' '/^version/{print $2; exit}' Cargo.toml)
          PKG="dist/deb/markd_${VERSION}_amd64"
          rm -rf dist
          mkdir -p "$PKG/usr/bin" "$PKG/usr/share/applications" "$PKG/DEBIAN"
          install -Dm755 target/release/markd "$PKG/usr/bin/markd"
          install -Dm644 assets/icon.png "$PKG/usr/share/icons/hicolor/256x256/apps/markd.png"
          cp packaging/linux/markd.desktop "$PKG/usr/share/applications/"
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: markd
          Version: ${VERSION}
          Section: editors
          Priority: optional
          Architecture: amd64
          Maintainer: Markd <noreply@example.com>
          Description: Markd - a Rust + egui Markdown editor
          EOF
          dpkg-deb --build --root-owner-group "$PKG" "Markd-${VERSION}-linux-amd64.deb"
          tar -czf "Markd-${VERSION}-linux-amd64.tar.gz" -C target/release markd
          # RPM：先用 staged root 装好文件，再由 rpmbuild 的 %install 从那里拷进 buildroot。
          # AutoReqProv=no 关掉自动依赖探测：二进制基本自包含，Ubuntu 的 rpm 工具
          # 探测 macOS 之外的系统库依赖意义不大，装出来的是"单文件应用"。
          RPMROOT="$PWD/dist/rpmroot"
          mkdir -p "$RPMROOT/usr/bin" \
            "$RPMROOT/usr/share/applications" \
            "$RPMROOT/usr/share/icons/hicolor/256x256/apps"
          install -Dm755 target/release/markd "$RPMROOT/usr/bin/markd"
          install -Dm644 assets/icon.png \
            "$RPMROOT/usr/share/icons/hicolor/256x256/apps/markd.png"
          install -Dm644 packaging/linux/markd.desktop \
            "$RPMROOT/usr/share/applications/markd.desktop"
          mkdir -p dist/rpmbuild
          cat > dist/rpmbuild/markd.spec <<EOF
          Name:           markd
          Version:        ${VERSION}
          Release:        1
          Summary:        Markd - a Rust + egui Markdown editor
          License:        MIT
          BuildArch:      x86_64
          AutoReqProv:    no

          %description
          Markdown editor built with Rust + egui (self-contained binary).

          %install
          mkdir -p %{buildroot}/usr/bin %{buildroot}/usr/share/applications %{buildroot}/usr/share/icons/hicolor/256x256/apps
          cp -r "$RPMROOT"/usr/* %{buildroot}/usr/

          %files
          /usr/bin/markd
          /usr/share/applications/markd.desktop
          /usr/share/icons/hicolor/256x256/apps/markd.png
          EOF
          rpmbuild -bb --define "_topdir $PWD/dist/rpmbuild" --define "_rpmdir $PWD" \
            dist/rpmbuild/markd.spec
          mv "x86_64/markd-${VERSION}-1.x86_64.rpm" "Markd-${VERSION}-linux-amd64.rpm"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            Markd-*.dmg
            Markd-*.zip
            Markd-*-setup.exe
            Markd-*.deb
            Markd-*.rpm
            Markd-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' ||
       github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/tags/v') ||
       startsWith(github.ref, 'refs/tags/20'))
    runs-on: ubuntu-latest
    steps:
      # checkout 会执行 git clean，必须放在下载产物之前，否则会把 out/ 清掉
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Collect
        run: |
          mkdir -p out
          find dist -type f | while read -r f; do cp "$f" out/; done
          ls -lh out
      # 滚动版（非 tag 的 master 构建）也要用版本号当标题：
      # 版本从 Cargo.toml 动态读，发版时只改 Cargo.toml 一处，标题与产物文件名自然一致。
      - name: Resolve version
        id: ver
        run: |
          VERSION=$(awk -F'"' '/^version/{print $2; exit}' Cargo.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Resolve tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "rolling=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "rolling=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish rolling latest release
        if: steps.tag.outputs.rolling == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag || true
          cat > notes.md <<EOF
          自动构建 ${GITHUB_SHA:0:7}（${GITHUB_REF_NAME}）

          - macOS（三种 DMG）：Markd-*-macos-intel.dmg（Intel 芯片）/ Markd-*-macos-apple-silicon.dmg（M 系列芯片）/ Markd-*-macos-universal.dmg（通用，两者都能跑）。打开后把 Markd 拖到 Applications
          - Windows：Markd-*-windows-setup.exe（安装向导）
          - Linux：Markd-*-linux-amd64.deb / .rpm / .tar.gz

          macOS 首次运行若提示「无法验证开发者」，执行： xattr -d com.apple.quarantine /Applications/Markd.app
          EOF
          gh release create latest out/* --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${{ steps.ver.outputs.version }}" \
            --notes-file notes.md \
            --latest
      - name: Publish tagged release
        if: steps.tag.outputs.rolling == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" out/* --repo "${GITHUB_REPOSITORY}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --generate-notes \
            --verify-tag
