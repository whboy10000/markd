name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*", "20*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  test:
    name: Test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxcursor-dev libxinerama-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-icccm4-dev \
            libxcb-keysyms1-dev libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev \
            libwayland-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: markd-macos
          - os: ubuntu-latest
            artifact: markd-linux
          - os: windows-latest
            artifact: markd-windows
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxcursor-dev libxinerama-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-icccm4-dev \
            libxcb-keysyms1-dev libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev \
            libwayland-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        if: runner.os != 'macOS'
        run: cargo build --release -p markd

      # macOS 产出 Intel + Apple Silicon 的通用二进制，一份 DMG 两种芯片都能跑
      - name: Build macOS universal binary
        if: runner.os == 'macOS'
        run: |
          set -e
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release -p markd --target aarch64-apple-darwin
          cargo build --release -p markd --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create \
            target/aarch64-apple-darwin/release/markd \
            target/x86_64-apple-darwin/release/markd \
            -output target/release/markd
          lipo -info target/release/markd

      # ---------------- macOS: .app + .dmg（拖拽安装） ----------------
      - name: Package macOS (.app + .dmg)
        if: runner.os == 'macOS'
        run: |
          set -e
          VERSION=$(awk -F'"' '/^version/{print $2; exit}' Cargo.toml)
          APP="Markd.app"
          rm -rf dist "$APP"
          mkdir -p "dist/$APP/Contents/MacOS" "dist/$APP/Contents/Resources"
          cp target/release/markd "dist/$APP/Contents/MacOS/markd"
          sed "s/__VERSION__/$VERSION/g" packaging/macos/Info.plist > "dist/$APP/Contents/Info.plist"
          chmod +x "dist/$APP/Contents/MacOS/markd"
          # 换文件名（AppIcon.icns）能绕开 macOS 按图标文件名做的缓存
          cp assets/icon.icns "dist/$APP/Contents/Resources/AppIcon.icns"
          codesign --force --deep --sign - "dist/$APP" || true
          # DMG 里放 .app + Applications 软链，打开后把图标拖进去即可安装
          mkdir -p dist/dmg
          cp -R "dist/$APP" dist/dmg/
          ln -sfn /Applications dist/dmg/Applications
          hdiutil create -volname "Markd" -srcfolder dist/dmg -ov -format UDZO \
            "Markd-$VERSION-macos.dmg"
          ditto -c -k --keepParent "dist/$APP" "Markd-$VERSION-macos.zip"

      # ---------------- Windows: NSIS 安装程序 ----------------
      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $makensis)) {
            choco install nsis -y --no-progress
            $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          }
          $src = (Resolve-Path "target\release").Path
          & $makensis "/DVERSION=$version" "/DSRCDIR=$src" "packaging\windows\installer.nsi"

      # ---------------- Linux: .deb + .tar.gz ----------------
      - name: Package Linux (.deb + .tar.gz)
        if: runner.os == 'Linux'
        run: |
          set -e
          VERSION=$(awk -F'"' '/^version/{print $2; exit}' Cargo.toml)
          PKG="dist/deb/markd_${VERSION}_amd64"
          rm -rf dist
          mkdir -p "$PKG/usr/bin" "$PKG/usr/share/applications" "$PKG/DEBIAN"
          install -Dm755 target/release/markd "$PKG/usr/bin/markd"
          install -Dm644 assets/icon.png "$PKG/usr/share/icons/hicolor/256x256/apps/markd.png"
          cp packaging/linux/markd.desktop "$PKG/usr/share/applications/"
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: markd
          Version: ${VERSION}
          Section: editors
          Priority: optional
          Architecture: amd64
          Maintainer: Markd <noreply@example.com>
          Description: Markd - a Rust + egui Markdown editor
          EOF
          dpkg-deb --build --root-owner-group "$PKG" "Markd-${VERSION}-linux-amd64.deb"
          tar -czf "Markd-${VERSION}-linux-amd64.tar.gz" -C target/release markd

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            Markd-*.dmg
            Markd-*.zip
            Markd-*-setup.exe
            Markd-*.deb
            Markd-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' ||
       github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/tags/v') ||
       startsWith(github.ref, 'refs/tags/20'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect
        run: |
          mkdir -p out
          find dist -type f | while read -r f; do cp "$f" out/; done
          ls -lh out
      # 滚动版（非 tag 的 master 构建）也要用版本号当标题：
      # 版本从 Cargo.toml 动态读，发版时只改 Cargo.toml 一处，标题与产物文件名自然一致。
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: |
          VERSION=$(awk -F'"' '/^version/{print $2; exit}' Cargo.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Resolve tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "rolling=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "rolling=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish rolling latest release
        if: steps.tag.outputs.rolling == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag || true
          cat > notes.md <<EOF
          自动构建 ${GITHUB_SHA:0:7}（${GITHUB_REF_NAME}）

          - macOS：Markd-*-macos.dmg（打开后把 Markd 拖到 Applications）
          - Windows：Markd-*-windows-setup.exe（安装向导）
          - Linux：Markd-*-linux-amd64.deb / .tar.gz

          macOS 首次运行若提示「无法验证开发者」，执行： xattr -d com.apple.quarantine /Applications/Markd.app
          EOF
          gh release create latest out/* --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${{ steps.ver.outputs.version }}" \
            --notes-file notes.md \
            --latest
      - name: Publish tagged release
        if: steps.tag.outputs.rolling == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" out/* --repo "${GITHUB_REPOSITORY}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --generate-notes \
            --verify-tag
