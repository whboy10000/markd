[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "2026.11.25"
edition = "2024"
authors = ["aurelianus <aurelianus@126.com>"]
license = "PolyForm-Noncommercial-1.0.0"

# 开发构建优化：GUI/文本排版大部分耗时在依赖（egui/epaint）里，
# 只优化依赖就能让 cargo run 的帧率成倍提升，同时自己的代码仍可断点调试。
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
egui = "0.37.0"
# 注意：关掉 default-features 后必须显式开启 x11 / wayland，否则 Linux 上 winit 会报
# "The platform you're compiling for is not supported by winit"。
eframe = { version = "0.37.0", default-features = false, features = [
    "glow",
    "default_fonts",
    "clipboard",
    "links",
    "x11",
    "wayland",
] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
muda = "0.21.2"
regex = "1.12.4"
memmap2 = "0.9.5"
winresource = "0.1.27"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# 图床上传与远程图片下载（阻塞式 HTTP + rustls）。
ureq = { version = "3.5.2", features = ["json"] }
base64 = "0.22.1"
# 阿里云 OSS 的 V1 签名 = base64(HMAC-SHA1(AccessKeySecret, 待签字符串))。
hmac = "0.12"
sha1 = "0.10"
# 火山引擎 TOS 的 V4 签名 = HMAC-SHA256 链式派生 + 请求体摘要。
sha2 = "0.10"
# 右键菜单「粘贴」需要主动读取系统剪贴板文本（egui 只暴露写入接口）。
arboard = "3.7.0"
# 仅用于从原始 Markdown 中识别 ```math 围栏（其余解析仍走自研 AST，
# 以保留源码无损往返）。
pulldown-cmark = { version = "0.13.6", default-features = false }
# RaTeX：把 LaTeX 公式排版并栅格化成 PNG。
ratex-parser = "0.1.16"
ratex-layout = "0.1.16"
ratex-render = { version = "0.1.16", default-features = false, features = ["embed-fonts"] }
ratex-types = "0.1.16"
# 原生显示列表渲染需要直接访问字体与字形轮廓。
ratex-font = "0.1.16"
ratex-font-loader = "0.1.16"
ab_glyph = "0.2.32"
# 把 RaTeX 的显示列表（字形轮廓、路径）细分成三角形网格，再交给 egui 的
# Mesh 直接上 GPU 绘制，避免 PNG 栅格化与纹理上传。
lyon = "1.0.12"
# 图床保存路径模板里的 {year}/{month}/{day} 需要本地时区时间。
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
markd-core = { path = "crates/markd-core" }
markd-platform = { path = "crates/markd-platform" }
markd-ui = { path = "crates/markd-ui" }
